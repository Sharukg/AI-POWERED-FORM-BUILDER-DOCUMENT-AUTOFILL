<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulate — build a form, drop in a document, done</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4F1;
    --panel:#FFFFFF;
    --ink:#211F1C;
    --ink-soft:#6B6862;
    --line:#E4E1DA;
    --accent:#3B4A9C;
    --accent-soft:#E9EBF6;
    --good:#2F7A4D;
    --good-soft:#E7F3EC;
    --warn:#B4740E;
    --warn-soft:#FBEEDC;
    --bad:#B23B3B;
    --bad-soft:#FBEAEA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',system-ui,sans-serif;}
  #root{min-height:100vh;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 32px;border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .brand{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .brand span{color:var(--accent);}
  .steps{display:flex;gap:6px;}
  .step{
    padding:7px 14px;border-radius:100px;font-size:13.5px;font-weight:500;
    color:var(--ink-soft);border:1px solid transparent;cursor:pointer;
  }
  .step.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
  .step.done{color:var(--good);}
  .step:disabled{cursor:not-allowed;opacity:.45;}

  .shell{max-width:1180px;margin:0 auto;padding:32px;}
  .lede{color:var(--ink-soft);font-size:15px;max-width:640px;line-height:1.55;margin:2px 0 26px;}

  .workspace{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start;}
  @media (max-width:900px){.workspace{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:22px;
  }
  .panel h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  .panel .sub{font-size:13px;color:var(--ink-soft);margin:0 0 16px;}

  .field-row{
    border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;
    display:flex;flex-direction:column;gap:10px;background:#FCFCFB;
    cursor:grab;
  }
  .field-row.dragging{opacity:.4;}
  .field-row-top{display:flex;align-items:center;gap:10px;}
  .drag-handle{color:var(--ink-soft);font-size:14px;cursor:grab;user-select:none;}
  .field-row input[type=text], .field-row select{
    flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;font-family:inherit;background:#fff;
  }
  .field-row-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .req-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);}
  .remove-btn{
    margin-left:auto;background:none;border:none;color:var(--bad);cursor:pointer;
    font-size:13px;padding:4px 8px;border-radius:6px;
  }
  .remove-btn:hover{background:var(--bad-soft);}
  .options-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}

  .add-field-btn{
    width:100%;padding:11px;border:1.5px dashed var(--line);border-radius:10px;
    background:none;color:var(--accent);font-weight:600;font-size:13.5px;cursor:pointer;
    margin-top:4px;
  }
  .add-field-btn:hover{background:var(--accent-soft);border-color:var(--accent);}

  .toolbar-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .ghost-btn{
    padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;
    font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent);}

  .preview-field{margin-bottom:16px;}
  .preview-field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .req-star{color:var(--bad);margin-left:3px;}
  .preview-field input, .preview-field select, .preview-field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
  }
  .preview-field textarea{resize:vertical;min-height:70px;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;padding:30px 0;text-align:center;}

  .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;display:inline-block;}
  .badge.high{background:var(--good-soft);color:var(--good);}
  .badge.medium{background:var(--warn-soft);color:var(--warn);}
  .badge.low{background:var(--bad-soft);color:var(--bad);}
  .badge.missing{background:var(--bad-soft);color:var(--bad);}

  .dropzone{
    border:1.5px dashed var(--line);border-radius:14px;padding:44px 24px;text-align:center;
    background:var(--panel);cursor:pointer;transition:border-color .15s;
  }
  .dropzone.drag{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone h3{margin:12px 0 4px;font-size:16px;}
  .dropzone p{margin:0;color:var(--ink-soft);font-size:13.5px;}
  .file-pill{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;background:var(--accent-soft);
    color:var(--accent);padding:6px 12px;border-radius:100px;font-size:13px;font-weight:600;
  }

  .primary-btn{
    padding:11px 20px;border-radius:9px;border:none;background:var(--accent);color:#fff;
    font-weight:600;font-size:14px;cursor:pointer;
  }
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;}
  .primary-btn:hover:not(:disabled){filter:brightness(1.08);}

  .banner{
    padding:12px 16px;border-radius:10px;font-size:13.5px;margin-bottom:18px;
  }
  .banner.error{background:var(--bad-soft);color:var(--bad);}
  .banner.info{background:var(--accent-soft);color:var(--accent);}
  .banner.success{background:var(--good-soft);color:var(--good);}

  .spinner{
    width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .review-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .checkbox-row{display:flex;align-items:center;gap:8px;}
</style>
</head>
